# Builds a release when a tag "v*" is pushed. The release carries pmm.py
# and pmm.py.sha256. pmm self-update downloads these two files.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches __version__
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pmm.py)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but __version__ is ${version}"; exit 1; }
      - name: Compile with Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m py_compile pmm.py
      - name: Write checksum
        run: sha256sum pmm.py > pmm.py.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" pmm.py pmm.py.sha256 --title "${GITHUB_REF_NAME}" --notes "pmm ${GITHUB_REF_NAME}"
